packages:
  - 'examples/*'
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: true
  sharp: true
  vue-demi: true
  workerd: true

catalog:
  '@babel/core': 7.29.0
  '@hey-api/openapi-ts': 0.96.0
  '@iconify-json/lucide': 1.2.116
  '@iconify-json/radix-icons': 1.2.6
  '@iconify-json/simple-icons': 1.2.86
  '@lucide/vue': 1.21.0
  '@radix-ui/colors': 3.0.0
  '@rolldown/plugin-babel': 0.2.1
  '@shikijs/core': 4.0.2
  '@shikijs/engine-javascript': 4.0.2
  '@shikijs/langs': 4.0.2
  '@tailwindcss/vite': 4.3.2
  '@tanstack/react-query': 5.101.2
  '@types/babel__core': 7.20.5
  '@types/node': 24.13.2
  '@typescript/native-preview': 7.0.0-dev.20260313.1
  '@unocss/reset': 66.7.5
  '@vitejs/plugin-vue': 6.0.7
  '@vueuse/core': 14.3.0
  bumpp: 11.1.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  consola: 3.4.2
  fflate: 0.8.3
  reka-ui: 2.9.10
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.2
  tw-animate-css: 1.4.0
  typescript: 5.9.3
  unocss: 66.7.5
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
  vite-plus: 0.2.1
  vitest: 4.1.9
  vue: 3.5.39
  vue-tsc: 3.3.7

catalogMode: prefer
configDependencies:
  '@pnpm/pacquet': 0.11.12
ignoreDepScripts: true
ignoreWorkspaceRootCheck: true
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
savePrefix: ''
shellEmulator: true
