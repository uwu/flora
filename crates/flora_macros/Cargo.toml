[package]
name = "flora_macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for exposing Serenity types to Flora SDK"

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "extra-traits", "parsing"] }
t0x = { workspace = true, features = ["serde-json-impl"] }
t0x-macros.workspace = true
