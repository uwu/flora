[package]
name = "deno_core"
version = "0.410.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/denoland/deno"
description = "A modern JavaScript/TypeScript runtime built with V8, Rust, and Tokio"

[lib]
path = "lib.rs"
test = false
doctest = false
bench = false

[features]
default = ["v8_use_custom_libcxx", "reactor-tokio"]
reactor-tokio = []
include_icu_data = ["dep:deno_core_icudata"]
quickjs = ["v8/quickjs", "serde_v8/quickjs"]
v8_use_custom_libcxx = ["v8/use_custom_libcxx"]
v8_enable_pointer_compression = ["v8/v8_enable_pointer_compression"]
v8_enable_v8_checks = ["v8/v8_enable_v8_checks"]
unsafe_runtime_options = []
unsafe_use_unprotected_platform = []
snapshot_flags_eager_parse = []
uv_compat_export = []
v8 = ["v8/v8", "serde_v8/v8"]

[dependencies]
anyhow = "=1.0.104"
az = "=1.3.0"
base64 = "=0.22.1"
bincode = "=1.3.3"
bit-set = "=0.8.0"
bit-vec = "=0.8.0"
boxed_error = "=0.2.3"
bytes = "=1.12.1"
capacity_builder = "=0.5.0"
cooked-waker = "=5.0.0"
deno_core_icudata = { version = "=0.77.0", optional = true }
deno_error = { version = "=0.7.1", features = ["serde_json", "serde", "url", "tokio"] }
deno_ops = "=0.286.0"
deno_path_util = "=0.6.4"
deno_unsync = { version = "=0.4.4", default-features = false, features = ["tokio"] }
futures = "=0.3.34"
indexmap = { version = "=2.14.0", features = ["serde"] }
inventory = "=0.3.24"
libc = "=0.2.189"
num-bigint = { version = "=0.4.8", features = ["rand"] }
parking_lot = "=0.12.5"
percent-encoding = "=2.3.2"
pin-project = "=1.1.13"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip", "preserve_order"] }
serde_v8 = { version = "=0.319.0", default-features = false }
smallvec = "=1.15.2"
sourcemap = "=9.3.2"
static_assertions = "=1.1.0"
sys_traits = { version = "=0.1.28", features = ["real"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["full"] }
url = { version = "=2.5.8", features = ["serde", "expose_internals"] }
uuid = { version = "=1.24.1", features = ["v4"] }
v8 = { version = "0.2.0", path = "deno_v8", package = "deno_v8", default-features = false, features = [
  "simdutf"
] }
wasm_dep_analyzer = "=0.4.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_WindowsProgramming",
  "Wdk",
  "Wdk_System",
  "Wdk_System_SystemInformation",
  "Win32_Security",
  "Win32_System_Pipes",
  "Wdk_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Win32_UI",
  "Win32_UI_Shell"
] }
