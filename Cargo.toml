[workspace]
resolver = "2"
members = ["apps/runtime", "crates/*", "crates/flora_js_core/deno_v8"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/uwu/flora"

[workspace.dependencies]
axum = "=0.8.9"
base64 = { version = "=0.23.1", default-features = false }
chacha20poly1305 = "=0.11.0"
clap = "=4.6.6"
color-eyre = "=0.6.5"
cookie = "=0.18.2"
croner = "=3.0.1"
dashmap = "=6.2.1"
deno_error = "=0.7.1"
deno_fetch = "=0.281.0"
deno_net = "=0.249.0"
deno_permissions = "=0.116.0"
deno_telemetry = "=0.79.0"
deno_tls = "=0.244.0"
deno_web = "=0.288.0"
deno_webidl = "=0.257.0"
dotenvy = "=0.15.7"
eyre = "=0.6.14"
flora = { path = "apps/runtime" }
flora_config = { path = "crates/flora_config" }
flora_macros = { path = "crates/flora_macros" }
fred = "=10.1.0"
futures = "=0.3.34"
futures-util = "=0.3.34"
hex = "=0.4.3"
hmac = "=0.13.0"
http = "=1.5.0"
openssl = "=0.10.81"
oxc = "=0.144.0"
oxc_sourcemap = "=8.1.2"
parking_lot = "=0.12.5"
pg-embed = "=1.0.0"
rand = "=0.10.2"
rocksdb = { version = "=0.25.0", default-features = false }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = "=0.9.0"
static-serve = "=0.6.3"
sys_traits = "=0.1.28"
tempfile = "=3.27.0"
time = "=0.3.55"
tokio = "=1.53.1"
tokio-stream = "=0.1.19"
tower-http = "=0.7.0"
tower-layer = "=0.3.3"
tower-service = "=0.3.3"
tracing = "=0.1.44"
tracing-error = "=0.2.1"
tracing-subscriber = "=0.3.23"
url = "=2.5.8"
urlencoding = "=2.1.3"
utoipa = "=5.5.0"
utoipa-scalar = "=0.3.0"
uuid = "=1.24.1"
chrono = "=0.4.45"
confique = "=0.4.0"
num_cpus = "=1.17.0"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
serde = "=1.0.229"
syn = "=3.0.3"
t0x = "=0.2.0"
t0x-macros = "=0.2.0"
thiserror = "=2.0.20"

[patch.crates-io]
deno_core = { path = "crates/flora_js_core" }
deno_v8 = { path = "crates/flora_js_core/deno_v8" }
